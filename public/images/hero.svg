<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="400" height="250" fill="#004d54" rx="15"/>
  <!-- Ondas de rastreo -->
  <circle cx="200" cy="125" r="80" fill="none" stroke="#00c2cb" stroke-width="2" stroke-dasharray="8 4" opacity="0.4"/>
  <circle cx="200" cy="125" r="60" fill="none" stroke="#00c2cb" stroke-width="3" opacity="0.7"/>
  <!-- Caja 3D simplificada -->
  <g transform="translate(160, 95)">
    <polygon points="40,0 80,20 40,40 0,20" fill="#00c2cb"/>
    <polygon points="0,20 40,40 40,80 0,60" fill="#00a3ab"/>
    <polygon points="40,40 80,20 80,60 40,80" fill="#00848a"/>
    <!-- Cinta de la caja -->
    <polygon points="40,10 50,15 40,20 30,15" fill="#004d54" opacity="0.5"/>
  </g>
</svg>
