<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="400" height="250" fill="#eef5f6" rx="15"/>
  <!-- Base de datos / Servidor -->
  <g transform="translate(140, 60)">
    <!-- Bloque 1 -->
    <rect x="0" y="0" width="120" height="30" rx="6" fill="#004d54"/>
    <circle cx="20" cy="15" r="4" fill="#00c2cb"/>
    <line x1="40" y1="15" x2="100" y2="15" stroke="#ffffff" stroke-width="4" opacity="0.3"/>
    <!-- Bloque 2 -->
    <rect x="0" y="40" width="120" height="30" rx="6" fill="#004d54"/>
    <circle cx="20" cy="55" r="4" fill="#00c2cb"/>
    <line x1="40" y1="55" x2="100" y2="55" stroke="#ffffff" stroke-width="4" opacity="0.3"/>
    <!-- Bloque 3 -->
    <rect x="0" y="80" width="120" height="30" rx="6" fill="#00c2cb"/>
    <circle cx="20" cy="95" r="4" fill="#ffffff"/>
    <line x1="40" y1="95" x2="100" y2="95" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  </g>
  <!-- Rayos de conexión de datos -->
  <path d="M 100,125 Q 120,125 140,115" fill="none" stroke="#00c2cb" stroke-width="3" stroke-linecap="round"/>
  <path d="M 300,125 Q 280,125 260,115" fill="none" stroke="#004d54" stroke-width="3" stroke-linecap="round"/>
</svg>
