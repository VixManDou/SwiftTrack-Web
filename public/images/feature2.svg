<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="400" height="250" fill="#eef5f6" rx="15"/>
  <!-- Tarjeta de gráfico -->
  <rect x="40" y="40" width="320" height="170" rx="10" fill="#ffffff" filter="drop-shadow(0px 5px 5px rgba(0,0,0,0.05))"/>
  <!-- Columnas de la gráfica -->
  <rect x="80" y="140" width="30" height="50" rx="5" fill="#004d54"/>
  <rect x="130" y="100" width="30" height="90" rx="5" fill="#00c2cb"/>
  <rect x="180" y="70" width="30" height="120" rx="5" fill="#004d54"/>
  <rect x="230" y="110" width="30" height="80" rx="5" fill="#00c2cb"/>
  <!-- Línea de tendencia -->
  <path d="M 95,130 L 145,90 L 195,60 L 245,100" fill="none" stroke="#00a3ab" stroke-width="4" stroke-linecap="round"/>
  <circle cx="245" cy="100" r="5" fill="#004d54"/>
</svg>
